<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project – Project Management Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside id="app-sidebar" class="sidebar"></aside>
    <div class="app-main">
      <header id="app-topbar" class="topbar"></header>
      <main class="content" id="project-content">
        <a href="projects.html" class="back-link">&larr; All projects</a>

        <div class="project-header">
          <div>
            <div class="project-header-top">
              <h1 id="project-title">Loading…</h1>
              <span id="project-status-badge" class="badge"></span>
            </div>
            <p id="project-description" class="project-description"></p>
          </div>
          <div id="owner-actions" class="project-header-actions" hidden>
            <button id="delete-project-btn" class="btn btn-danger btn-sm" type="button">Delete project</button>
          </div>
        </div>

        <div class="project-meta-row">
          <div><span class="meta-label">Owner</span><span id="project-owner"></span></div>
          <div><span class="meta-label">Timeline</span><span id="project-dates"></span></div>
          <div><span class="meta-label">Members</span><div id="project-members" class="member-chips"></div></div>
        </div>

        <div class="board-toolbar">
          <h2>Board</h2>
          <button id="add-task-btn" class="btn btn-primary btn-sm" type="button" hidden>+ New task</button>
        </div>
        <div class="board" id="board">
          <p class="empty-note">Loading board…</p>
        </div>
      </main>
    </div>
  </div>

  <div class="modal" id="task-modal" hidden>
    <div class="modal-box">
      <div class="modal-header">
        <h3>New task</h3>
        <button id="task-modal-close" class="modal-close" type="button" aria-label="Close">&times;</button>
      </div>
      <p id="task-modal-error" class="form-error"></p>
      <form id="task-form" novalidate>
        <label for="task-title">Title</label>
        <input type="text" id="task-title" required>
        <label for="task-description">Description</label>
        <textarea id="task-description" rows="3"></textarea>
        <div class="form-row">
          <div>
            <label for="task-assignee">Assign to</label>
            <select id="task-assignee"></select>
          </div>
          <div>
            <label for="task-priority">Priority</label>
            <select id="task-priority">
              <option>Low</option>
              <option selected>Medium</option>
              <option>High</option>
            </select>
          </div>
        </div>
        <label for="task-due">Due date</label>
        <input type="date" id="task-due">
        <div class="modal-actions">
          <button type="button" id="task-modal-cancel" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-primary">Create task</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/project.js"></script>
</body>
</html>
