<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task details – Project Management Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside id="app-sidebar" class="sidebar"></aside>
    <div class="app-main">
      <header id="app-topbar" class="topbar"></header>
      <main class="content" id="task-content">
        <a id="task-breadcrumb" href="projects.html" class="back-link">&larr; Back to project</a>
        <p id="task-detail-error" class="form-error"></p>

        <form id="task-detail-form" class="task-detail-form" novalidate>
          <input type="text" id="task-title-input" class="task-title-input" required aria-label="Task title">
          <textarea id="task-description-input" rows="4" placeholder="Add a description…" aria-label="Task description"></textarea>

          <div class="form-row">
            <div>
              <label for="task-status-select">Status</label>
              <select id="task-status-select">
                <option>To Do</option>
                <option>In Progress</option>
                <option>Review</option>
                <option>Completed</option>
              </select>
            </div>
            <div>
              <label for="task-priority-select">Priority</label>
              <select id="task-priority-select">
                <option>Low</option>
                <option>Medium</option>
                <option>High</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div>
              <label for="task-assignee-select">Assigned to</label>
              <select id="task-assignee-select"></select>
            </div>
            <div>
              <label for="task-due-input">Due date</label>
              <input type="date" id="task-due-input">
            </div>
          </div>

          <div class="modal-actions">
            <button type="button" id="delete-task-btn" class="btn btn-danger" hidden>Delete task</button>
            <button type="submit" class="btn btn-primary">Save changes</button>
          </div>
        </form>

        <section class="comments-section">
          <h2>Comments</h2>
          <div id="comments-list" class="comments-list"><p class="empty-note">Loading…</p></div>
          <form id="comment-form" class="comment-form" novalidate>
            <textarea id="comment-input" rows="2" placeholder="Add a comment…" required></textarea>
            <button type="submit" class="btn btn-primary btn-sm">Post comment</button>
          </form>
        </section>
      </main>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/taskDetail.js"></script>
</body>
</html>
